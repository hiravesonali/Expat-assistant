# DRAFT source registry for the Germany-wide expansion (Berlin, Hamburg, Frankfurt am Main, Köln,
# Stuttgart + rent-cap regulations of BE, HH, HE, NW, BW). Same format as sources.yaml.
# Research + verification: 2026-11-22, plain curl with UA "Mozilla/5.0 (compatible; AnkommenResearch/0.1)".
# Raw HTML/PDF samples: data/_research/<id>.html|pdf (git-ignored). Evidence: docs/research/germany-sources.md.
#
# NOT drop-in ready:
#   * `parser: law_pdf` does not exist yet (ParserName in src/expat/ingestion/sources.py). State gazette
#     PDFs (GVBl/GBl) are the only robots-allowed official law text for BE, HH, HE, BW: the juris
#     portals gesetze.berlin.de, landesrecht-hamburg.de, rv.hessenrecht.hessen.de and landesrecht-bw.de
#     send "User-agent: * / Disallow: /" (only named search engines are allowed).
#   * `parser: recht_nrw_html` does not exist yet (recht.nrw.de; could reuse the bayern_recht approach).
#   * New hosts need site profiles in parsers/html.py (proposals in germany-sources.md).
#   * city slugs (berlin, hamburg, frankfurt, cologne, stuttgart) and new subtopics must be added to
#     docs/conventions.md together with the ids.
#   * frankfurt.de: Cloudflare challenge (HTTP 403 "Just a moment...") on /leistungen/* and /english/*
#     paths for non-browser clients -> those pages need fetch_method: manual.

