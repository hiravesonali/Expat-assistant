# Source registry: the input of the ingestion pipeline (`uv run python -m expat.ingestion --all`).
# Field reference: docs/data-sources.md ("sources.yaml entry format"); model: src/expat/ingestion/sources.py.
# source_ids are fixed in docs/conventions.md. Add a row there in the same commit as a new entry here.
# Excluded on purpose (terms / AI-crawler blocks): deutsche-rentenversicherung.de, arbeitsagentur.de,
# gesetze-im-internet English translations, muenchen.de, fimportal.de.

# --------------------------------------------------------------------------------------------
# Laws (gesetze-im-internet.de XML, public domain under § 5 UrhG)
# --------------------------------------------------------------------------------------------
- id: bgb
  name: "Bürgerliches Gesetzbuch (BGB)"
  publisher: "Bundesministerium der Justiz / gesetze-im-internet.de"
  url: https://www.gesetze-im-internet.de/bgb/xml.zip
  source_type: law
  parser: law_xml
  law_abbrev: BGB
  domain: tenancy
  domain_map:
    - range: "186-193"      # Fristen/Termine: used for notice-period deadlines
      domain: tenancy
      subtopic: deadlines
    - range: "535-580a"
      domain: tenancy
      subtopic: rental_law
    # Keyword-only ranges: everyday / English terms the statute itself does not use.
    - {range: "536-536d", domain: tenancy, keywords: [Mietminderung, rent reduction, defects]}
    - {range: "551", domain: tenancy, keywords: [Kaution, security deposit]}
    - {range: "553", domain: tenancy, keywords: [Untervermietung, sublet, subletting]}
    - {range: "556-556c", domain: tenancy, keywords: [Nebenkosten, Betriebskostenabrechnung, utility costs]}
    - {range: "556d-556g", domain: tenancy, keywords: [Mietpreisbremse, rent cap, rent control]}
    - {range: "557-561", domain: tenancy, keywords: [Mieterhöhung, rent increase]}
    - {range: "568-576b", domain: tenancy, keywords: [Kündigung, notice, terminate tenancy, move out]}
  include_ranges: ["186-193", "535-580a"]
  language: de
  jurisdiction: federal
  fetch_method: http
  refresh: weekly
  terms: "§ 5 UrhG, public domain"

- id: aufenthg
  name: "Aufenthaltsgesetz (AufenthG)"
  publisher: "Bundesministerium der Justiz / gesetze-im-internet.de"
  url: https://www.gesetze-im-internet.de/aufenthg_2004/xml.zip
  source_type: law
  parser: law_xml
  law_abbrev: AufenthG
  domain: bureaucracy
  subtopic: residence
  domain_map:
    - range: "27-36a"
      domain: bureaucracy
      subtopic: family_reunification
      keywords: [family reunification, spouse visa]
    - {range: "9-9c", domain: bureaucracy, keywords: [permanent residence, settlement permit]}
    - {range: "18c", domain: bureaucracy, keywords: [permanent residence, settlement permit, Blue Card]}
    - {range: "18g", domain: bureaucracy, keywords: [EU Blue Card, minimum salary]}
    - {range: "81", domain: bureaucracy, keywords: [apply, application, Ausländerbehörde]}
  # Residence titles, employment (§ 18g Blue Card), settlement (§ 9, § 18c), family reunion,
  # integration course, expiry, application procedure (§ 81).
  include_ranges: ["4-9c", "18-21", "27-36a", "43-45a", "51-52", "81-82"]
  language: de
  jurisdiction: federal
  applies_to: [non_eu]
  fetch_method: http
  refresh: weekly
  terms: "§ 5 UrhG, public domain"

- id: bmg
  name: "Bundesmeldegesetz (BMG)"
  publisher: "Bundesministerium der Justiz / gesetze-im-internet.de"
  url: https://www.gesetze-im-internet.de/bmg/xml.zip
  source_type: law
  parser: law_xml
  law_abbrev: BMG
  domain: bureaucracy
  subtopic: anmeldung
  keywords: [address registration, register address, Anmeldung]
  include_ranges: ["17-31", "54"]
  language: de
  jurisdiction: federal
  fetch_method: http
  refresh: weekly
  terms: "§ 5 UrhG, public domain"

- id: beeg
  name: "Bundeselterngeld- und Elternzeitgesetz (BEEG)"
  publisher: "Bundesministerium der Justiz / gesetze-im-internet.de"
  url: https://www.gesetze-im-internet.de/beeg/xml.zip
  source_type: law
  parser: law_xml
  law_abbrev: BEEG
  domain: family
  subtopic: elterngeld
  keywords: [parental allowance, Elterngeld]
  domain_map:
    - range: "15-21"
      domain: family
      subtopic: elternzeit
      keywords: [parental leave]
  language: de
  jurisdiction: federal
  fetch_method: http
  refresh: weekly
  terms: "§ 5 UrhG, public domain"

- id: estg
  name: "Einkommensteuergesetz (EStG): Steuerklassen §§ 26, 38b–39f, Kindergeld §§ 62–78"
  publisher: "Bundesministerium der Justiz / gesetze-im-internet.de"
  url: https://www.gesetze-im-internet.de/estg/xml.zip
  source_type: law
  parser: law_xml
  law_abbrev: EStG
  domain: family
  subtopic: kindergeld
  keywords: [Kindergeld, child benefit]
  domain_map:
    # Phase 3 (2026-11-23): joint assessment, classes I-VI, ELStAM (IV/IV on marriage), factor method.
    - range: "26-39f"
      domain: taxes
      subtopic: tax_classes
      keywords: [tax class, Steuerklasse, married couple, Faktorverfahren, factor method]
  include_ranges: ["26", "38b", "39", "39e", "39f", "62-78"]
  language: de
  jurisdiction: federal
  fetch_method: http
  refresh: weekly
  terms: "§ 5 UrhG, public domain"

