# Streamlit config (committed). Secrets go in .streamlit/secrets.toml (git-ignored), see secrets.toml.example.
# Community Cloud reads this file from the repo root, because it runs `streamlit run` from the root.
#
# Brand "Ankommen" (German: to arrive / to settle in). Modern & bold: a vivid indigo → violet brand gradient
# (the logo tile), one warm amber accent (the arrow in the logo), crisp cool-white canvas, bold geometric
# headings (Plus Jakarta Sans) and Inter for body text. Brand tokens are repeated in app/ui.py (CSS).

[theme]
base = "light"
primaryColor = "#4F46E5"             # indigo: primary buttons, focus rings, toggles, links
backgroundColor = "#FAFAFD"          # cool white canvas
secondaryBackgroundColor = "#F1F1F8" # inputs, code blocks, expanders
textColor = "#16172B"
linkColor = "#4F46E5"
borderColor = "#E4E4F0"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "large"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 600, 600]
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#F4F4FB"
secondaryBackgroundColor = "#EAEAF5"

[client]
toolbarMode = "minimal"        # hide developer menu items for visitors
showErrorDetails = "none"      # never show tracebacks (which may contain secrets) to visitors
showSidebarNavigation = false  # the debug pages are reached from Settings, not listed for every visitor

[browser]
gatherUsageStats = false
