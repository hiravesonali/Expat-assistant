# Streamlit config (committed). Secrets go in .streamlit/secrets.toml (git-ignored), see secrets.toml.example.
# Community Cloud reads this file from the repo root, because it runs `streamlit run` from the root.
#
# Design: a calm, warm "paper" canvas with one accent colour (deep teal = trustworthy, official, not
# alarming). Serif headings + Inter body text, like modern AI chat products.

[theme]
base = "light"
primaryColor = "#1F6F64"             # deep teal: primary buttons, focus rings, toggles
backgroundColor = "#FAF9F6"          # warm off-white canvas
secondaryBackgroundColor = "#F2F0EA" # inputs, code blocks, expanders
textColor = "#26251F"
linkColor = "#1F6F64"
borderColor = "#E4E1D8"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "large"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
headingFontWeights = [500, 500, 500, 500, 500, 500]
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#EAE7DF"

[client]
toolbarMode = "minimal"        # hide developer menu items for visitors
showErrorDetails = "none"      # never show tracebacks (which may contain secrets) to visitors
showSidebarNavigation = false  # the debug pages are reached from Settings, not listed for every visitor

[browser]
gatherUsageStats = false
